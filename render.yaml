databases:
  - name: gym-recovery-db
    plan: free
    databaseName: gym_recovery_tracker
    user: gym_recovery_user

services:
  - type: web
    name: gym-recovery-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: gym-recovery-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://gym-recovery-app.onrender.com

  - type: web
    name: gym-recovery-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://gym-recovery-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
